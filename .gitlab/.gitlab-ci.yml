stages:
  - docker
  - format
  - build
  - tests
  - examples
  - dist-test
  - publish

variables:
  USER: "marvin"
  IMAGE_NAME: $CI_REGISTRY_IMAGE
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

.global-rules:
  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"
      when: on_success
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"
      when: on_success
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: on_success
    - if: $CI_COMMIT_MESSAGE =~ /.*WIP.*/
      when: never
    - if: $CI_COMMIT_MESSAGE =~ /.*(RUN-CI).*/
      when: on_success

# only applies when PR is made against master
.final-qa-rules:
  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"
      when: on_success

docker:build-python3.10:
  stage: docker
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  extends: .global-rules
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker pull ${IMAGE_NAME}:python3.10 || true
    - docker build --cache-from ${IMAGE_NAME}:python3.10 -t
      ${IMAGE_NAME}:python3.10 -f .gitlab/dockerfile --build-arg
      CI_JOB_TOKEN=$CI_JOB_TOKEN --build-arg BASE_IMAGE=python:3.10-slim .
    - docker push $IMAGE_NAME:python3.10

docker:build-python3.11:
  stage: docker
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  extends: .global-rules
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker pull ${IMAGE_NAME}:python3.11 || true
    - docker build --cache-from ${IMAGE_NAME}:python3.11 -t
      ${IMAGE_NAME}:python3.11 -f .gitlab/dockerfile --build-arg
      CI_JOB_TOKEN=$CI_JOB_TOKEN --build-arg BASE_IMAGE=python:3.11-slim .
    - docker push $IMAGE_NAME:python3.11

pre-commit-hooks:
  stage: format
  extends: .final-qa-rules
  image: $IMAGE_NAME:python3.11
  script:
    - pip3 install pylint pre-commit
    - pre-commit install
    - pre-commit run --all-files

pre-commit-hooks-soft:
  stage: format
  image: $IMAGE_NAME:python3.11
  allow_failure: true
  script:
    - pip3 install pylint pre-commit
    - pip3 install -e .
    - pre-commit install
    - pre-commit run --all-files --config .pre-commit-config-soft.yaml

.build:
  stage: build
  extends: .global-rules
  script:
    - pip3 install .

build.python3.10:
  extends: .build
  image: $IMAGE_NAME:python3.10

build.python3.11:
  extends: .build
  image: $IMAGE_NAME:python3.11

.build-dev:
  stage: build
  extends: .global-rules
  artifacts:
    paths:
      - artefacts/**
    expire_in: 72 hours
  script:
    - pip3 install ".[dev]"

build-dev.python3.10:
  extends: .build-dev
  image: $IMAGE_NAME:python3.10

build-dev.python3.11:
  extends: .build-dev
  image: $IMAGE_NAME:python3.11

.test:
  stage: tests
  extends: .global-rules
  artifacts:
    paths:
      - artefacts/**
    expire_in: 72 hours
  script:
    - pip3 install .
    - pip3 install ".[dev]"
    - pytest

test.python3.10:
  extends: .test
  image: $IMAGE_NAME:python3.10

test.python3.11:
  extends: .test
  image: $IMAGE_NAME:python3.11

.examples:
  stage: examples
  extends: .global-rules
  script:
    - pip3 install .
    - cd examples/
    - for example in ./*.py; do echo "Running $example"; python3 $example; done

examples.python3.10:
  extends: .examples
  image: $IMAGE_NAME:python3.10

examples.python3.11:
  extends: .examples
  image: $IMAGE_NAME:python3.11

.dist-test:
  stage: dist-test
  extends: .global-rules
  script:
    - pip3 install twine build
    - python3 -m build
    - twine check dist/*
    - pip3 install dist/*.whl
    - python -c "import tiamat; print(tiamat.__version__)"

dist-test.python3.10:
  extends: .dist-test
  image: $IMAGE_NAME:python3.10

dist-test.python3.11:
  extends: .dist-test
  image: $IMAGE_NAME:python3.11

publish:pypi:
  stage: publish
  image: $IMAGE_NAME:python3.11
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: on_success
    - when: never
  variables:
    TWINE_USERNAME: "__token__"
    # CI variable
    TWINE_PASSWORD: "$PYPI_TOKEN"
    TWINE_NON_INTERACTIVE: "1"
  script:
    - set -euo pipefail
    - python3 --version
    - git status --porcelain
    - test -z "$(git status --porcelain)"
    - rm -rf dist build *.egg-info

    # Ensure the tag commit is contained in master.
    - git fetch origin master
    - git merge-base --is-ancestor "$CI_COMMIT_SHA" "origin/master"

    # Build + sanity checks.
    - pip3 install --upgrade pip
    - pip3 install build twine
    - python3 -m build
    - twine check dist/*

    # Install wheel in a clean venv and validate version matches tag.
    - python3 -m venv .venv-publish
    - . .venv-publish/bin/activate
    - pip install --upgrade pip
    - pip install dist/*.whl
    - TAG_VERSION="${CI_COMMIT_TAG#v}"
    - python -c "import tiamat, sys; print(tiamat.__version__); sys.exit(0 if tiamat.__version__ == '${TAG_VERSION}' else 1)"
    - deactivate
    - rm -rf .venv-publish

    # Upload to PyPI.
    - twine upload dist/*
