stages:
  - build
  - tests
  - examples

variables:
  USER: "marvin"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

.global-rules:
  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"
      when: on_success
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+/
      when: on_success
    - if: $CI_COMMIT_MESSAGE =~ /.*WIP.*/
      when: never
    - if: $CI_COMMIT_MESSAGE =~ /.*(RUN-CI).*/
      when: on_success

before_script:
  - apt-get -y update
  - apt-get -y upgrade
  - apt-get install -y git
  - pip3 install --upgrade pip
  - pip3 install --upgrade setuptools
  - pip3 install --upgrade wheel
  - pip3 install git+https://github.com/FZJ-INM1-BDA/pytiff

.build:
  stage: build
  extends: .global-rules
  script:
    - pip3 install .

build.python3.10:
  extends: .build
  image: python:3.10-slim

build.python3.11:
  extends: .build
  image: python:3.11-slim

.build-dev:
  stage: build
  extends: .global-rules
  script:
    - pip3 install ".[dev]"

build-dev.python3.10:
  extends: .build-dev
  image: python:3.10-slim

build-dev.python3.11:
  extends: .build-dev
  image: python:3.11-slim

.test:
  stage: tests
  extends: .global-rules
  script:
    - pip3 install .
    - pip3 install ".[dev]"
    - pytest

test.python3.10:
  extends: .test
  image: python:3.10-slim

test.python3.11:
  extends: .test
  image: python:3.11-slim

.examples:
  stage: examples
  extends: .global-rules
  script:
    - pip3 install .
    - for example in examples/*.py; echo "Running $example"; do python3
      $example; done

examples.python3.10:
  extends: .examples
  image: python:3.10-slim

examples.python3.11:
  extends: .examples
  image: python:3.11-slim
